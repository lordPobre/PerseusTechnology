# Abre un PR semanal cuando hay versiones nuevas (incluye parches de seguridad de Django).
# El CI corre sobre cada PR: si pasa, se puede fusionar sin miedo.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Santiago
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
